# Builds the Windows installer, and publishes it when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0   -> tests, installer, GitHub Release with notes
#   Actions -> release -> Run workflow          -> tests and installer only, kept as a build artifact
#
# The tag must match the version in pyproject.toml. Release notes come from installer/notes/<tag>.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_VERSION: "0.12.22"
  # The FFmpeg build the installer carries, checked against the checksum recorded at build time.
  FFMPEG_VERSION: "9.0.2"
  # Inno Setup 7 changed the script language; this installer is written for 6.
  INNO_VERSION: "6.7.1"
  INNO_TAG: "is-6_7_1"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: FFmpeg for the tests (the same build users get)
        shell: pwsh
        run: |
          gh release download $env:FFMPEG_VERSION --repo GyanD/codexffmpeg --pattern "ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip" --dir $env:RUNNER_TEMP
          & "$env:SystemRoot\System32\tar.exe" -xf "$env:RUNNER_TEMP\ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip" -C $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\ffmpeg-$env:FFMPEG_VERSION-essentials_build\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q -p no:warnings

  installer:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: The tag is the version
        id: version
        shell: pwsh
        run: |
          $version = (uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match version $version in pyproject.toml"
          }
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - name: Wheel, and the versions the tests passed with
        id: wheel
        shell: pwsh
        run: |
          uv build --wheel -o dist
          "name=$((Get-ChildItem dist\*.whl).Name)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          # Every package at the lockfile's version: one (PyAV 19) broke transcription in installs
          # that took whatever was newest.
          New-Item -ItemType Directory -Force installer\build | Out-Null
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt -o installer\build\requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "uv export failed" }
      - name: FFmpeg, its notice, the GPU pack's size, language file
        id: parts
        shell: pwsh
        run: |
          $zip = "ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip"
          gh release download $env:FFMPEG_VERSION --repo GyanD/codexffmpeg --pattern $zip --dir $env:RUNNER_TEMP
          $sha = (Get-FileHash "$env:RUNNER_TEMP\$zip" -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$zip"
          (Get-Content installer\FFMPEG-NOTICE.txt -Raw).Replace("{VERSION}", $env:FFMPEG_VERSION).Replace("{URL}", $url).Replace("{SHA256}", $sha) |
            Out-File -Encoding utf8 installer\build\FFMPEG-NOTICE.txt
          Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/$env:INNO_TAG/Files/Languages/Unofficial/ChineseTraditional.isl" -OutFile installer\build\ChineseTraditional.isl
          "zip=$env:RUNNER_TEMP\$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          # What the component page says the GPU pack takes, from the one place it is pinned.
          $env:PYTHONPATH = "src"
          uv run --no-project python -c "from app.gpu import PACK; print(f'gpu_mb={round(PACK.size / 2**20)}'); print(f'gpu_installed_mb={round(PACK.installed_size / 2**20)}'); print(f'gpu_installed_bytes={PACK.installed_size}')" |
            Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Payload (Python, packages, clip-mcp, FFmpeg)
        shell: pwsh
        run: |
          installer\build_payload.ps1 -Out installer\build\payload -Wheel "dist\${{ steps.wheel.outputs.name }}" `
            -Requirements installer\build\requirements.txt -FfmpegZip "${{ steps.parts.outputs.zip }}" `
            -FfmpegFolder "ffmpeg-${{ env.FFMPEG_VERSION }}-essentials_build"
          "### Payload, uncompressed (bytes): before and after slimming" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content installer\build\payload-sizes-before.json, installer\build\payload-sizes.json | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Inno Setup
        run: choco install innosetup --version ${{ env.INNO_VERSION }} --no-progress -y
      - name: Installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DPayload=build\payload" `
            "/DGpuSizeMB=${{ steps.parts.outputs.gpu_mb }}" `
            "/DGpuInstalledMB=${{ steps.parts.outputs.gpu_installed_mb }}" `
            "/DGpuInstalledBytes=${{ steps.parts.outputs.gpu_installed_bytes }}" `
            installer\clip-mcp.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "Installer: $([math]::Round((Get-Item dist\clip-mcp-setup-*.exe).Length / 1MB, 1)) MB" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: clip-mcp-setup-${{ steps.version.outputs.version }}
          path: dist/clip-mcp-setup-*.exe
      - name: Release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist\clip-mcp-setup-*.exe).FullName `
            --title "clip-mcp $env:GITHUB_REF_NAME" --notes-file "installer\notes\$env:GITHUB_REF_NAME.md"
        env:
          GH_TOKEN: ${{ github.token }}
