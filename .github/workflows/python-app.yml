# Installs the project with uv, then lints and runs the test suite.
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # The tests synthesize their own footage and measure real renders, so
    # ffmpeg and ffprobe both have to be on PATH. The runner image has neither.
    # The burned-in caption test draws CJK text and counts the lit pixels, so
    # libass also needs a font that actually covers those glyphs.
    - name: Install FFmpeg and a CJK font
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-noto-cjk

    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true

    # pyproject.toml pins requires-python to >=3.14; uv fetches it if the
    # runner does not have it.
    - name: Install dependencies
      run: uv sync --locked

    - name: Lint with ruff
      run: |
        # Stop the build on syntax errors and undefined names. Style is not
        # gated: the codebase has no ruff config to gate it against.
        uv run --with ruff ruff check --select=E9,F63,F7,F82 --output-format=github .
        uv run --with ruff ruff check --exit-zero --statistics .

    - name: Test with pytest
      run: uv run pytest
