[project]
name = "clip-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "fastmcp>=4.0.4",
    "opencc>=1.4.2",
    "pillow>=12",
    "pydantic>=2.13.5",
    "typing-extensions>=4.16.0",
]

[project.scripts]
clip-mcp = "app.server:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
