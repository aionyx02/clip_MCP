[project]
name = "clip-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "fastmcp>=4.0.4",
    # Chinese word splitting, so a caption broken into lines is not broken inside a word:
    # the recogniser returns Chinese a character at a time.
    "jieba>=0.42.1",
    # Beat tracking on music. Already here through opencv; named because the beat
    # tracker imports it directly.
    "numpy>=2.5.3",
    "opencc>=1.4.2",
    # Face detection, for its YuNet wrapper. The headless build leaves out the GUI
    # windowing a server has no use for and cannot open anyway.
    "opencv-python-headless>=4.10",
    "pillow>=12",
    "pydantic>=2.13.5",
    # Speaker diarization, on onnxruntime rather than torch: the models are plain
    # files this server fetches and stores itself, and none of them is gated.
    "sherpa-onnx>=1.13",
    "typing-extensions>=4.16.0",
]

[project.scripts]
clip-mcp = "app.cli:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
