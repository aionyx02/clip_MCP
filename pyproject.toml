[project]
name = "clip-mcp"
version = "0.1.9"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # faster-whisper decodes audio through PyAV and passes it `metadata_errors`, which PyAV 19
    # removed: every transcription fails. Held below 19 until faster-whisper stops passing it.
    "av>=11,<19",
    # The history of every project, plan and caption is a git repository; written with a
    # pure-Python git, since nobody installing this is expected to have git.
    "dulwich>=1.2.17",
    "faster-whisper>=1.2.1",
    "fastmcp>=4.0.4",
    # One writer at a time on that history: the MCP server and the editor are two processes.
    # Already here through faster-whisper; named because the history imports it directly.
    "filelock>=3.13",
    # Chinese word splitting, so a caption broken into lines is not broken inside a word:
    # the recogniser returns Chinese a character at a time.
    "jieba>=0.42.1",
    # Beat tracking on music. Already here through opencv; named because the beat
    # tracker imports it directly.
    "numpy>=2.5.3",
    # Search by meaning runs a small ONNX model with its tokenizer. Both already come
    # with faster-whisper; named because the search imports them directly.
    "onnxruntime>=1.30.0",
    "tokenizers>=0.23.2",
    "opencc>=1.4.2",
    # Face detection, for its YuNet wrapper. The headless build leaves out the GUI
    # windowing a server has no use for and cannot open anyway.
    "opencv-python-headless>=4.10",
    "pillow>=12",
    "pydantic>=2.13.5",
    # Speaker diarization, on onnxruntime rather than torch: the models are plain
    # files this server fetches and stores itself, and none of them is gated.
    "sherpa-onnx>=1.13",
    "typing-extensions>=4.16.0",
]

[project.scripts]
clip-mcp = "app.cli:main"

[project.gui-scripts]
# The editor, started from its shortcut with no console window behind it.
clip-mcp-editor = "app.ui.launch:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
